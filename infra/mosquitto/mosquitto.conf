# Mosquitto 2.1.2. No anonymous access, one listener inside the compose network, no HTTP API listener.
# (per_listener_settings is left at its default, false: one set of rules for every listener. Setting it explicitly is
# deprecated in 2.1.)
allow_anonymous false

# The state of a camera is rebuilt when it reconnects; nothing needs to survive a broker restart.
persistence false

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883

# Dynamic security: roles and users live in this file and are changed over MQTT by the API.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json
